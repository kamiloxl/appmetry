plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.appdashattribution'
version = '0.1.0'

android {
  namespace "expo.modules.appdashattribution"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "com.android.installreferrer:installreferrer:2.2"
}
