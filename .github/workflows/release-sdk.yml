name: Release SDK
on:
  push:
    tags:
      - 'sdk-v*'
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Check tag matches SDK version
        run: |
          VERSION=$(node -p "require('./packages/sdk-expo/package.json').version")
          if [ "$GITHUB_REF_NAME" != "sdk-v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/sdk-expo version $VERSION (expected sdk-v$VERSION)" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter appmetry build
      - run: pnpm --filter appmetry publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
